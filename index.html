<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Onlyscheli Gaming</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #202b46);
      color: white;
      text-align: center;
      min-height: 100vh;
    }

    header {
      padding: 25px 15px;
      font-size: 24px;
      font-weight: bold;
      background: #0b1220;
      border-bottom: 2px solid #39e58c;
    }

    main {
      padding: 80px 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
    }

    .game-box {
      max-width: 420px;
      margin: 35px auto;
      padding: 30px 20px;
      background: #26334c;
      border-radius: 20px;
      border: 1px solid #465570;
    }

    .game-icon {
      font-size: 65px;
      margin-bottom: 15px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      background: #39e58c;
      color: #081b12;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      border-radius: 12px;
      transition: 0.2s;
    }

    .button:hover {
      background: #72f5b0;
      transform: scale(1.05);
    }

    footer {
      padding: 25px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    🎮 ONLYSCHELI GAMING
  </header>

  <main>
    <h1>Willkommen!</h1>

    <p>
      Willkommen auf meiner Gaming-Seite.<br>
      Wähle dein Spiel und leg los!
    </p>

    <div class="game-box">
      <div class="game-icon">🐍</div>

      <h2>Anaconda</h2>

      <p>Bereit zum Spielen?</p>

      <a class="button" href="anaconda.html">
        Jetzt spielen!
      </a>
    </div>
  </main>

  <footer>
    © 2026 Onlyscheli Gaming
  </footer>

</body>
</html>
